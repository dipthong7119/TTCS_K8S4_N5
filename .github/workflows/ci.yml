name: CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-test:
    name: Sprint 3 CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Linter (Ruff)
        run: python -m ruff check app tests alembic ../tests ../scripts

      - name: Typecheck application (Mypy)
        run: python -m mypy app

      - name: Audit installed dependencies
        run: python -m pip_audit --local --progress-spinner off

      - name: Run Unit Tests (Pytest)
        run: python -m pytest tests ../tests --ignore=../tests/test_scrum182_20charger_scenario.py --tb=short -v --cov=app --cov-branch --cov-report=term --cov-report=xml

      - name: Save coverage report
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: backend/coverage.xml

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check frontend behavior
        working-directory: .
        run: node --test tests/frontend_behavior.cjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: csms-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate existing Docker Compose OCPP acceptance
        id: smoke-tests
        timeout-minutes: 5
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          export CSMS_IMAGE=csms-app:ci
          docker compose --env-file .env.example -p csms-sprint12-acceptance -f docker-compose.acceptance.yml up -d --no-build --wait --wait-timeout 120 db app
          python -m pytest tests/sprint2_docker_acceptance.py tests/test_scrum182_20charger_scenario.py::test_scrum182_smoke_3_chargers --tb=short -v

      - name: Build intentionally broken recovery image (T-56 verification only)
        working-directory: .
        run: docker build --builder default -t csms-app:t56-negative .github/t56-negative

      - name: T-56 / SCRUM-185 - 20-charger recovery and kWh gate
        id: sprint3-acceptance
        timeout-minutes: 5
        working-directory: .
        run: python scripts/run_sprint3_ci.py --image csms-app:t56-negative --no-build --project csms-sprint3-ci --repeat 3

      - name: Save Sprint 3 acceptance evidence
        if: always() && steps.sprint3-acceptance.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: sprint3-20-charger-evidence
          path: outputs/sprint3-ci/
          retention-days: 14
          if-no-files-found: error

      - name: Stop Sprint 3 acceptance stack
        if: always() && steps.sprint3-acceptance.outcome != 'skipped'
        working-directory: .
        run: docker compose --env-file .env.example -p csms-sprint3-ci -f docker-compose.acceptance.yml down -v --remove-orphans

      - name: Collect failed Docker smoke-test diagnostics
        if: failure() && steps.smoke-tests.outcome == 'failure'
        working-directory: .
        run: |
          docker compose --env-file .env.example -p csms-sprint12-acceptance -f docker-compose.acceptance.yml ps --all
          docker compose --env-file .env.example -p csms-sprint12-acceptance -f docker-compose.acceptance.yml logs --no-color --tail 100

      - name: Stop Docker Compose smoke-test stack
        if: always()
        working-directory: .
        run: docker compose --env-file .env.example -p csms-sprint12-acceptance -f docker-compose.acceptance.yml down -v --remove-orphans
