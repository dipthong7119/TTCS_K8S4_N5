name: CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Linter (Ruff)
        run: python -m ruff check app tests alembic ../tests

      - name: Typecheck application (Mypy)
        run: python -m mypy app

      - name: Audit installed dependencies
        run: python -m pip_audit --local --progress-spinner off

      - name: Run Unit Tests (Pytest)
        run: python -m pytest tests ../tests --tb=short -v --cov=app --cov-branch --cov-report=term --cov-report=xml

      - name: Save coverage report
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: backend/coverage.xml

      - name: Check frontend behavior
        working-directory: .
        run: node --test tests/frontend_behavior.cjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: csms-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test Docker Compose OCPP simulator
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          export CSMS_IMAGE=csms-app:ci
          docker compose --env-file .env.example -p csms-sprint12-acceptance -f docker-compose.acceptance.yml up -d --no-build --wait db app
          python -m pytest tests/sprint2_docker_acceptance.py --tb=short -v

      - name: Stop Docker Compose smoke-test stack
        if: always()
        working-directory: .
        run: docker compose --env-file .env.example -p csms-sprint12-acceptance -f docker-compose.acceptance.yml down -v --remove-orphans
