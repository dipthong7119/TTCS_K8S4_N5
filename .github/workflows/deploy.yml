name: CD Pipeline - Deploy to Staging

on:
  push:
    branches: [ "main", "master", "sprint-3" ]

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # Reuse all CI checks from this commit, including Docker and OCPP acceptance.
    uses: ./.github/workflows/ci.yml

  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    # Serialize deployments to the same server across main and master.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/csms-app:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/csms-app:latest

      - name: Kiểm tra secrets Staging (bỏ qua nếu chưa cấu hình)
        id: check-secrets
        run: |
          MISSING=()
          [[ -z "${{ secrets.STAGING_HOST }}" ]]     && MISSING+=("STAGING_HOST")
          [[ -z "${{ secrets.STAGING_USERNAME }}" ]] && MISSING+=("STAGING_USERNAME")
          [[ -z "${{ secrets.STAGING_SSH_KEY }}" ]]  && MISSING+=("STAGING_SSH_KEY")
          [[ -z "${{ secrets.STAGING_SSH_PORT }}" ]] && MISSING+=("STAGING_SSH_PORT")
          [[ -z "${{ secrets.GHCR_PAT }}" ]]         && MISSING+=("GHCR_PAT")

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "⚠️  Chưa cấu hình secrets: ${MISSING[*]}"
            echo "   → Bỏ qua bước SSH Deploy (cần cấu hình khi có server staging thật)."
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Staging Server via SSH
        if: steps.check-secrets.outputs.deploy_enabled == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          script: |
            set -eu
            cd /opt/csms-staging
            printf '%s' '${{ secrets.GHCR_PAT }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            NEW_IMAGE=ghcr.io/${{ github.repository_owner }}/csms-app:${{ github.sha }}
            PREVIOUS_IMAGE=$(docker inspect --format='{{.Config.Image}}' csms_app 2>/dev/null || true)
            docker pull "$NEW_IMAGE"
            docker compose -f docker-compose.yml up -d db

            cleanup_candidate() {
              docker rm -f csms_staging_candidate >/dev/null 2>&1 || true
            }
            trap cleanup_candidate EXIT
            cleanup_candidate

            # Validate the new image on a loopback-only port while the old app runs.
            CSMS_IMAGE="$NEW_IMAGE" docker compose -f docker-compose.yml run -d --no-deps \
              --name csms_staging_candidate -p 127.0.0.1:18000:8000 app
            healthy() {
              for attempt in $(seq 1 30); do
                if curl --max-time 3 -fsS "$1/health" >/dev/null \
                  && curl --max-time 3 -fsSL "$1/" >/dev/null; then
                  return 0
                fi
                sleep 2
              done
              return 1
            }
            if ! healthy http://127.0.0.1:18000; then
              docker logs --tail 80 csms_staging_candidate
              echo "Candidate failed its health check; the previous app is still running."
              exit 1
            fi

            if ! CSMS_IMAGE="$NEW_IMAGE" docker compose -f docker-compose.yml up -d --no-deps app \
              || ! healthy http://127.0.0.1:8000; then
              if [ -n "$PREVIOUS_IMAGE" ]; then
                CSMS_IMAGE="$PREVIOUS_IMAGE" docker compose -f docker-compose.yml up -d --no-deps app
                healthy http://127.0.0.1:8000
              fi
              echo "Deployment failed; restored the previous image where available."
              exit 1
            fi
            echo "Staging deployment completed and health checks passed."
