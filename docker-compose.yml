version: '3.8'

services:
  app:
    image: ${CSMS_IMAGE:-csms-app:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: csms_app
    ports:
      - "8000:8000"
    volumes:
      # Mount file SQLite từ backend/ ra host để dữ liệu không bị mất khi xoá container
      # Lưu ý: file backend/csms.db phải TỒN TẠI trên host trước khi mount
      # (nếu chưa có: chạy 'cd backend && alembic upgrade head' một lần trên local)
      - ./backend/csms.db:/app/csms.db
      # Mount frontend for local editing; the production image also contains this directory.
      - ./frontend:/app/frontend
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
