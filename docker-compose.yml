services:
  db:
    image: postgres:15-alpine
    container_name: csms_db
    environment:
      POSTGRES_DB: ${CSMS_DB_NAME:-csms}
      POSTGRES_USER: ${CSMS_DB_USER:-csms}
      POSTGRES_PASSWORD: ${CSMS_DB_PASSWORD:-csms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CSMS_DB_USER:-csms} -d ${CSMS_DB_NAME:-csms}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    image: ${CSMS_IMAGE:-csms-app:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: csms_app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${CSMS_DB_USER:-csms}:${CSMS_DB_PASSWORD:-csms}@db:5432/${CSMS_DB_NAME:-csms}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  simulator:
    image: ${CSMS_SIMULATOR_IMAGE:-csms-simulator:1.0.0}
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["ocpp-simulator"]
    depends_on:
      app:
        condition: service_healthy
    command:
      - python
      - -m
      - app.dev_tools.ocpp_simulator.simulator
      - --count
      - "${CSMS_SIMULATOR_COUNT:-20}"
      - --include-demo-stations
      - "${CSMS_SIMULATOR_INCLUDE_DEMO_STATIONS:-false}"
      - --server-url
      - "${CSMS_SIMULATOR_URL:-ws://app:8000/ocpp}"
    restart: "no"

  backup:
    image: postgres:15-alpine
    container_name: csms_backup
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${CSMS_DB_NAME:-csms}
      PGUSER: ${CSMS_DB_USER:-csms}
      PGPASSWORD: ${CSMS_DB_PASSWORD:-csms}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${CSMS_BACKUP_RETENTION_DAYS:-14}
    volumes:
      - postgres_backups:/backups
      - ./backend/scripts/backup_postgres.sh:/usr/local/bin/backup_postgres.sh:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/usr/local/bin/backup_postgres.sh"]
    command: ["loop"]
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_backups:
