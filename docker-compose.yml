version: '3.8'

services:
  app:
    build:
      context: ./hardware
      dockerfile: Dockerfile
    container_name: csms_app
    ports:
      - "8000:8000"
    volumes:
      # Mount file SQLite cục bộ ra ngoài để dữ liệu không bị mất khi xoá container
      - ./csms.db:/app/csms.db
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
